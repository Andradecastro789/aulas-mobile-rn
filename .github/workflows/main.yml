name: Deploy do Exemplo Carrinho para o Docker Hub

# Aciona o robô em push e pull request na branch main/master
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'primeirobi/exemplosaula/exemplo-carrinho/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'primeirobi/exemplosaula/exemplo-carrinho/**'

jobs:
  build-e-push:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: O robô baixa o seu código
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: O robô faz login no Docker Hub usando seus Secrets
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Passo 3: O robô executa o Build e faz o Push automaticamente
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./primeirobi/exemplosaula/exemplo-carrinho
          file: ./primeirobi/exemplosaula/exemplo-carrinho/Dockerfile
          push: true
          tags: mariaacastro/exemplo-carrinho:latest

      # Passo 4: Deploy no Azure App Service (CORRIGIDO SÓ A INDENTAÇÃO)
      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: Docker95
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'mariaacastro/exemplo-carrinho:latest'
