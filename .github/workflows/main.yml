name: Deploy do Exemplo Carrinho para o Docker Hub

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'primeirobi/exemplosaula/exemplo-carrinho/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'primeirobi/exemplosaula/exemplo-carrinho/**'

jobs:
  build-e-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./primeirobi/exemplosaula/exemplo-carrinho
          file: ./primeirobi/exemplosaula/exemplo-carrinho/Dockerfile
          push: true
          tags: mariaacastro/exemplo-carrinho:latest

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: Docker95
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'mariaacastro/exemplo-carrinho:latest'
